name: Feature request
description: Suggest a new tool or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to be able to do?
      description: Describe the capability. If it maps to something in the System Informer GUI, mention where.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Proposed tool / arguments (optional)
      description: If you have an idea for the tool name and inputs, sketch it here.
      render: json
